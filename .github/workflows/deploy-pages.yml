name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # android/ is the AR Android project (its own Gradle build, its own
    # build-android.yml workflow). It produces nothing this site serves, so an
    # Android-only push has no reason to rebuild and republish the webapp.
    paths-ignore:
      - "android/**"
  # 正式 OTA release 發佈後再部署一次。
  #
  # ota-release.yml 寫好 release/ota/latest.json 與 ota/latest.json 之後，會用
  # 帶 [skip ci] 的 commit 推回 main —— 那個標記正是為了避免無窮迴圈，但副作用
  # 是這個 workflow 不會因此重跑，於是 Pages 繼續提供上一次部署時的 manifest。
  # 結果是線上的 ota/latest.json 永遠落後一個版本：眼鏡查到的是上一版，裝置
  # 更新後看到的也是上一版，而 repo 裡明明已經是新的。2026-11-10 的驗收現場就
  # 因為這個問題反覆出現「機器上還是舊的」。
  #
  # workflow_run 不受 [skip ci] 影響，所以這裡補上一次部署。下面的 job 會先確認
  # 那次 release 真的成功才繼續，失敗的 release 不應該把站上的 manifest 換掉。
  workflow_run:
    workflows: ["OTA Web Bundle Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 由 OTA release 觸發時，只有那次 release 成功才部署；其他觸發方式照舊。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        working-directory: webapp
        run: npm ci
      - name: Build
        working-directory: webapp
        run: npm run build
      # Single source of truth for "what the live site actually contains".
      # There is one build: webapp's. GuGo Invest used to be a second Vite app
      # installed and built here, and copied in under gugo-invest/dist/ for
      # scenario01 to load in an iframe; it is an App module inside webapp now
      # (webapp/src/apps/gugo-invest/), so it comes out of that one build like
      # every other App.
      # Both deployment paths below (the committed-to-repo-root copy AND the
      # Pages Actions artifact) are derived from this exact same site/
      # directory, so they can't drift apart from each other the way
      # webapp/dist and gugo-app/ once did when only one of the two paths
      # was ever updated.
      - name: Assemble published site
        run: |
          rm -rf site
          mkdir -p site
          cp -r webapp/dist/. site/
          # The OTA pointer travels with the site so an online Shell can read
          # https://eric-pv.github.io/ScamAware-AR/ota/latest.json without going through the
          # GitHub API. It is *generated* by ota-release.yml and committed under release/;
          # re-staging it here is what keeps it alive through the root wipe below, and what
          # republishes it if a deploy runs before the release commit's own copy lands.
          # Absent until the first formal OTA release, which is not an error.
          if [ -f release/ota/latest.json ]; then
            mkdir -p site/ota
            cp release/ota/latest.json site/ota/latest.json
          fi
      # Repeated testing has shown this repo's Pages deployment actually
      # serving the repo root directly (README.md as a fallback index, old
      # root files shadowing every Actions-based deploy below) regardless of
      # what Settings -> Pages -> Source shows selected. Rather than keep
      # depending on that setting, also publish site/ straight to the repo
      # root on main - whichever mode Pages is actually in, the correct app
      # is what ends up there. This only touches the exact top-level entries
      # site/ contains, never webapp/ (its source - site/ is what's actually
      # built from it), android/ (the AR Android project, which is source too and
      # is built by build-android.yml, not by anything here), legacy-static-site/,
      # .github/, docs/, or README.md.
      #
      # This used to hardcode that top-level entry list (assets,
      # favicon.svg, index.html, manifest.json, sw.js). Twice now that has
      # silently gone stale: once when mediapipe-wasm/ and models/ were
      # removed from the build (rm -rf on a missing path is a no-op, but
      # git add on one is a hard error, so deploys quietly failed here for
      # every push until someone noticed), and again when webapp/public
      # started emitting data/ and scenario03/ (new region JSON, new scam
      # scenario's audio folder) that this step never knew to stage - they
      # landed in the working tree but were never committed, so the live
      # site never actually got them. Deriving the list from site/'s own
      # contents each run means a future new top-level output (or a removed
      # one) just works without another edit here.
      - name: Publish build output to repo root
        run: |
          for entry in *; do
            case "$entry" in
              # release/ is the version source of truth and the OTA release records - source,
              # not build output, and deleting it would take every published bundle's manifest
              # with it. CLAUDE.md is the repo-wide agent rulebook. Both live at the root and
              # neither comes out of site/, so both have to be named here or this loop removes
              # them on the next deploy.
              webapp|android|legacy-static-site|.github|docs|release|README.md|CLAUDE.md|site) ;;
              *) rm -rf -- "$entry" ;;
            esac
          done
          cp -r site/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!webapp' ':!android' ':!legacy-static-site' ':!.github' ':!docs' ':!release' ':!README.md' ':!CLAUDE.md' ':!site'
          if git diff --cached --quiet; then
            echo "Build output unchanged, nothing to publish."
          else
            git commit -m "Publish webapp build output to repo root [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
